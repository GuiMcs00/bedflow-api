services:
  postgres:
    image: postgres:16-alpine
    container_name: bedflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bedflow
      POSTGRES_USER: bedflow
      POSTGRES_PASSWORD: bedflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bedflow -d bedflow"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata: